<script>
(function() {
  // Визначаємо поточний рік
  var currentYear = 2026;
  var currentMonth = 10; // Жовтень 2026 (ЖОВТЕНЬ ВЖЕ ДОСТУПНИЙ)
  var today = new Date();

  var months = [
    'Січень', 'Лютий', 'Березень', 'Квітень', 'Травень', 'Червень',
    'Липень', 'Серпень', 'Вересень', 'Жовтень', 'Листопад', 'Грудень'
  ];

  var container = document.getElementById('transportTiles');

  // Майбутні місяці поточного року
  for (var m = 9; m <= 12; m++) {
    var tile = document.createElement('a');
    tile.className = 'transport-tile';
    tile.href = '/transport/' + currentYear + '-' + String(m).padStart(2, '0') + '.html';

    var icon = document.createElement('div');
    icon.className = 'icon';
    icon.textContent = '🚌';

    var month = document.createElement('div');
    month.className = 'month';
    month.textContent = months[m - 1];

    var year = document.createElement('div');
    year.className = 'year';
    year.textContent = currentYear + ' рік';

    tile.appendChild(icon);
    tile.appendChild(month);
    tile.appendChild(year);

    // Майбутні місяці (поточний+1) - ще немає
    if (m > currentMonth) {
      tile.classList.add('disabled');
      var badge = document.createElement('div');
      badge.className = 'badge';
      badge.textContent = 'Скоро';
      tile.appendChild(badge);
    }

    container.appendChild(tile);
  }

  // Минулий рік (2025)
  // ...
})();
</script>

        31:  { V: 52, OV: 3, TN: 0, V_names: ["Проценко Ю.М.", "Білоус В.О.", "Пирогова С.М.", "Карапась М.Г.", "Здор О.А.", "Новікова З.М.", "Іващенко А.А.", "Піддубна І.Д.", "Володченко В.Л.", "Кукса В.В.", "Кващук Н.О.", "Ільїна А.Ю.", "Надточій С.В.", "Товстоп'ят Л.А.", "Репеченко А.А.", "Кльоц В.Г.", "Мартиненко А.В.", "Ільїн А.О.", "Слюсар О.Є.", "Пилипенко В.І.", "Сідина А.П.", "Шпаковський П.П.", "Павличук М.М.", "Бойко С.В.", "Костецька О.О.", "Гаврилюк О.Л.", "Гавриш В.О.", "Матвєєв В.Ю.", "Бован В.І.", "Зінченко Л.О.", "Федоряка П.А.", "Мойсюк Г.І.", "Панченко Н.М.", "Андрющенко О.В.", "Луценко З.М.", "Павленко О.І.", "Липкань Л.М.", "Карпенко А.М.", "Бажин В.І.", "Буркалов С.О.", "Синиця В.В.", "Павленко О.А.", "Таран О.Ф.", "Турчанович Б.В.", "Загородній О.М.", "Сергієнко В.З.", "Яремака В.І.", "Ковзалін С.В.", "Дахно А.Г.", "Чурута О.І.", "Потужний О.В.", "Онопрієнко А.І."], OV_names: ["Селіверстова С.І.", "Васеленко Ю.В.", "Дороховець М.М."], TN_names: [] }
      }
  };

  function getDayData(monthNum, day) {
    var m = dayData[monthNum];
    if (!m) return null;
    return m[day] || null;
  }

  var monthNames = ['Січень','Лютий','Березень','Квітень','Травень','Червень',
                    'Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];

  var months = [
    { num: 9, name: 'Вересень 2026', days: 30 },
    { num: 10, name: 'Жовтень 2026', days: 31 },
    { num: 11, name: 'Листопад 2026', days: 30 },
    { num: 12, name: 'Грудень 2026', days: 31 }
  ];

  for (var mi = 0; mi < months.length; mi++) {
    var month = months[mi];
    var block = document.createElement('div');
    block.className = 'transport-month-block';

    var title = document.createElement('h3');
    title.textContent = month.name;
    block.appendChild(title);

    var grid = document.createElement('div');
    grid.className = 'transport-day-grid';

    // Заголовки днів тижня (Пн, Вт, Ср, Чт, Пт, Сб, Нд)
    var weekdayHeaders = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Нд'];
    for (var wi = 0; wi < 7; wi++) {
      var hd = document.createElement('div');
      hd.className = 'weekday-header';
      hd.textContent = weekdayHeaders[wi];
      hd.style.cssText = 'text-align:center;font-weight:900;color:#1f4e9e;font-size:13px;padding:4px 0;border-bottom:2px solid #1f4e9e';
      grid.appendChild(hd);
    }

    // Визначаємо day-of-week для 1-го числа місяця
    // 9 (вересень) 2026: 1 вересня = Вт (вівторок, offset=1)
    // 10 (жовтень) 2026: 1 жовтня = Чт (offset=3)
    // 11 (листопад) 2026: 1 листопада = Нд (offset=6)
    // 12 (грудень) 2026: 1 грудня = Вт (offset=1)
    var firstDayOffset = {9: 1, 10: 3, 11: 6, 12: 1};
    var firstWeekday = firstDayOffset[month.num];

    // Додаємо порожні комірки на початку (щоб день 1 потрапив у правильну колонку)
    for (var p = 0; p < firstWeekday; p++) {
      var emptyCell = document.createElement('div');
      emptyCell.style.cssText = 'background:transparent;min-height:130px';
      grid.appendChild(emptyCell);
    }

    for (var d = 1; d <= month.days; d++) {
      var data = getDayData(month.num, d);
      var hasData = !!data;

      // Визначаємо день тижня
      var dayIndex = (firstWeekday + d - 1) % 7;
      var isWeekend = (dayIndex === 5 || dayIndex === 6); // Сб, Нд

      var cell = document.createElement('a');
      cell.className = 'transport-day-cell' + (hasData ? '' : ' disabled-cell') + (isWeekend ? ' weekend' : '');
      cell.href = '/transport/' + month.num + '/' + String(d).padStart(2, '0') + '.html';

      // Top-left: заплановано (чорним)
      var topLeft = document.createElement('div');
      topLeft.className = 'day-top-left';
      if (hasData) {
        topLeft.textContent = data.plan;
      } else {
        topLeft.innerHTML = '<span style="color:#bbb">—</span>';
      }
      cell.appendChild(topLeft);

      // Right column: В, ОВ, ТН
      var right = document.createElement('div');
      right.className = 'day-right';
      function addStat(label, key, namesKey) {
        var row = document.createElement('div');
        row.className = 'stat';
        var lbl = document.createElement('span');
        lbl.className = 'stat-label stat-' + key.toLowerCase();
        lbl.textContent = label;
        var val = document.createElement('span');
        if (hasData && data[key] !== undefined && data[key] !== null) {
          val.className = 'stat-val stat-' + key.toLowerCase();
          val.textContent = data[key];
        } else {
          val.className = 'stat-val placeholder';
          val.textContent = '—';
        }
        row.appendChild(lbl);
        row.appendChild(val);
        right.appendChild(row);
        // Names list (if namesKey provided and data has it)
        if (namesKey && hasData && data[namesKey] && Array.isArray(data[namesKey]) && data[namesKey].length > 0) {
          var namesDiv = document.createElement('div');
          namesDiv.className = 'stat-names stat-' + key.toLowerCase() + '-names';
          namesDiv.textContent = data[namesKey].join(', ');
          right.appendChild(namesDiv);
        }
      }
      addStat('В', 'V', 'V_names');
      addStat('ОВ', 'OV', 'OV_names');
      addStat('ТН', 'TN', 'TN_names');
      cell.appendChild(right);

      // Center: trolley виходи (великим червоним) + фактично
      var center = document.createElement('div');
      center.className = 'day-center';

      // Trolley (найбільше число, червоним великим)
      var trolleyEl = document.createElement('div');
      if (hasData && data.trolley !== undefined && data.trolley !== null) {
        trolleyEl.className = 'trolley-count';
        trolleyEl.style.cssText = 'color:#d92d20;font-weight:900;font-size:24px;line-height:1.1;text-align:center';
        trolleyEl.textContent = data.trolley;
      } else {
        trolleyEl.className = 'trolley-count placeholder';
        trolleyEl.style.cssText = 'color:#bbb;font-weight:900;font-size:24px;line-height:1.1;text-align:center';
        trolleyEl.textContent = '—';
      }
      center.appendChild(trolleyEl);

      var fact = document.createElement('div');
      if (hasData) {
        fact.className = 'day-fact';
        fact.textContent = data.fact;
      } else {
        fact.className = 'day-fact placeholder';
        fact.textContent = '—';
      }
      center.appendChild(fact);
      cell.appendChild(center);

      // Bottom-left: число місяця (синім)
      var bottomLeft = document.createElement('div');
      bottomLeft.className = 'day-bottom-left';
      bottomLeft.textContent = d + ' ' + monthNames[month.num - 1].toLowerCase().slice(0,3) + '.';
      cell.appendChild(bottomLeft);

      grid.appendChild(cell);
    }

    // Кнопка "← Транспорт" в кінці кожного місяця
    var backWrap = document.createElement('div');
    backWrap.style.cssText = 'grid-column:1 / -1;text-align:center;margin-top:14px';
    var back = document.createElement('a');
    back.href = '/transport.html';
    back.className = 'btn-transport-back';
    back.innerHTML = '🚌 Транспорт';
    back.style.cssText = 'display:inline-block;background:#1f4e9e;color:#fff;text-decoration:none;padding:10px 22px;border-radius:10px;font-size:15px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.18)';
    backWrap.appendChild(back);
    grid.appendChild(backWrap);

    block.appendChild(grid);
    container.appendChild(block);
  }
})();
</script>
